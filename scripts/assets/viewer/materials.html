<script type="module">
import * as THREE from 'three';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search), W = innerWidth, H = innerHeight, R = '../../../assets/runtime/';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);

async function setHDRI(name) {
  const hdr = await new HDRLoader().loadAsync(R + 'hdri/' + name + '.hdr');

  return { w: hdr.image.width, h: hdr.image.height };

  const [map, normalMap, arm, emissiveMap] = await Promise.all([tex(base + 'albedo.webp', true), tex(nrm), tex(base + 'arm.webp'), m.emissive ? tex(base + 'emissive.webp', true) : null]);

  geo.setAttribute('uv1', geo.attributes.uv);

    const m = await material(mats[i], tier), mesh = new THREE.Mesh(geo, m);

  }

async function prop(url) {
  const g = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(url), box = new THREE.Box3().setFromObject(g.scene), s = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  scene.add(g.scene); const d = Math.max(s.x, s.y, s.z) * 1.6 + 0.5; cam.position.set(c.x + d * 0.7, c.y + d * 0.35, c.z + d * 0.7); cam.lookAt(c);

(async () => { if (q.get('hdri')) await setHDRI(q.get('hdri')); if (q.get('grid')) await grid(q.get('tier') || ''); window.READY = true; })().catch((e) => { errors.push(String(e.stack || e)); window.READY = true; });
</script></body></html>
